<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Parallel API Calls</title>
</head>

<body>

  <h2>Parallel API Calls</h2>

  <button onclick="stopOnFail()">Stop on First Failure</button>
  <button onclick="runAll()">Run All APIs</button>
  <button onclick="runParallel()">Run APIs</button>
  <pre id="output">Click a button</pre>

  <script>
    const output = document.getElementById("output");

    const urls = [
      "https://jsonplaceholder.typicode.com/users/1",
      "https://jsonplaceholder.typicode.com/posts/1",
      "https://jsonplaceholder.typicode.com/comments/2",
      "https://jsonplaceholder.typicode.com/todos/1",
      "https://jsonplaceholder.typicode.com/albums/1"
    ];

    async function stopOnFail() {
      output.textContent = "Loading...";

      const controller = new AbortController();

      try {
        const results = await Promise.all(
          urls.map(url =>
            fetch(url, { signal: controller.signal })
              .then(res => {
                if (!res.ok) {
                  throw new Error(`Failed API → ${url}`);
                }
                return res.json();
              })
          )
        );

        output.textContent = JSON.stringify(results, null, 2);

      } catch (err) {
        controller.abort();
        output.innerHTML = `<span class="error">${err.message}</span>`;
      }
    }
    async function runAll() {
      output.textContent = "Loading...";

      const results = await Promise.allSettled(
        urls.map(url =>
          fetch(url)
            .then(res => {
              if (!res.ok) {
                throw new Error(`Failed API → ${url}`);
              }
              return res.json();
            })
        )
      );

      output.textContent = JSON.stringify(results, null, 2);
    }
    async function runParallel() {
  output.textContent = "Loading...\n";

  const controller = new AbortController();
  const signal = controller.signal;

  const completedResults = [];

  const promises = urls.map((url, index) =>
    fetch(url, { signal })
      .then(res => {
        if (!res.ok) {
          throw new Error(`API ${index + 1} failed`);
        }
        return res.json();
      })
      .then(data => {
        completedResults.push(`✅ API ${index + 1} success`);
      })
      .catch(err => {
        if (signal.aborted) return;

        output.textContent += completedResults.join("\n") + "\n";
        output.textContent += `\nERROR: ${err.message}\n`;
        output.textContent += "Aborting remaining APIs";

        controller.abort();
        throw err;
      })
  );

  try {
    await Promise.all(promises);
    output.textContent += "\nAll APIs succeeded";
  } catch {}
}
  </script>

</body>
</html>
