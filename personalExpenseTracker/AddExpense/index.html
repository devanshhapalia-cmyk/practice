<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Expense Tracker</h1>
    <form action="" id="myForm">
        <h2>Add your expense details</h2>
        <label for="inputExpense">Amount:</label>
        <input type="number" id="inputExpense" required> 
        <label for="inputDiscription">Description:</label>
        <input type="text" id="inputDiscription" required>
        <label for="inputCategory">Category:</label>
        <select id="inputCategory" required>
            <option value="">-- Select an option --</option>
        </select>
        <label for="inputDate">Date:</label>
        <input type="date" id="inputDate" required>
        <button type="submit" id="addExpense">Add Expense</button>
    </form>
    <script src="/home/devanshhapalia/Desktop/Practice/personalExpenseTracker/app.js"></script>
</body>

</html>
